modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "EPL-2.0"
issueTrackerURL = "https://github.com/EngineHub/WorldEditCUI/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "WorldEditCUI"
logoFile = "assets/worldeditcui/icon.png"
displayURL = "https://github.com/EngineHub/WorldEditCUI"
authors = "lahwran, yetanotherx, Mumfrey, TomyLobo, mikroskeem; NeoForge port"
description = '''
Client-side user interface for WorldEdit (unofficial NeoForge port).
'''
<% if (legacy_metadata) { %>displayTest = "IGNORE_ALL_VERSION"
<% } %>
[[dependencies.${mod_id}]]
modId = "${platform_mod_id}"
<% if (legacy_metadata) { %>mandatory = true<% } else { %>type = "required"<% } %>
versionRange = "${platform_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
<% if (legacy_metadata) { %>mandatory = true<% } else { %>type = "required"<% } %>
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
<% if (cui_protocol_version) { %>
[[dependencies.${mod_id}]]
modId = "worldeditcui_protocol"
type = "required"
versionRange = "[${cui_protocol_version},)"
ordering = "NONE"
side = "CLIENT"
<% } %>
[[dependencies.${mod_id}]]
modId = "worldedit"
<% if (legacy_metadata) { %>mandatory = false<% } else { %>type = "optional"<% } %>
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
<% if (mixin_config) { %>
[[mixins]]
config = "${mixin_config}"
<% } %><% if (access_transformer) { %>
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
<% } %>
